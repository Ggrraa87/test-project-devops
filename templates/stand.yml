variables:
  RUNNER_TAG: "devsecops-108"
  JOB_UID: "65532"
  CI_TOOLS_IMAGE: "127.0.0.1:8081/finance-docker/ci/ci-tools:2026.08-r3"
  KANIKO_IMAGE: "127.0.0.1:8081/finance-docker/ci/kaniko-nonroot:v1.23.2-r7"

  VAULT_ADDR: "http://vault:8200"
  VAULT_AUTH_PATH: "jwt-gitlab"
  VAULT_KV_MOUNT: "ci"
  VAULT_AUDIENCE: "vault-gitlab-ci"
  VAULT_ROLE_PREFIX: "gitlab-ci"
  VAULT_SIGNING_MOUNT: "transit"

  NEXUS_HOST: "nexus"
  NEXUS_URL: "http://nexus:8081"
  NEXUS_REGISTRY: "nexus:8081"
  NEXUS_RAW_REPOSITORY: "go-artifacts"
  NEXUS_DOCKER_REPOSITORY: "finance-docker"
  GOPROXY: "http://nexus:8081/repository/go-public"

  WEBHOOK_URL: "https://webhook:8443/hook"

  SIGNER_CERT_FILE: "/etc/devsecops/trust/todo-api-signing.crt"
  SIGNER_CA_FILE: "/etc/devsecops/trust/signing-root-ca.crt"
  WEBHOOK_CA_CERT: "/etc/devsecops/trust/webhook-root-ca.crt"
  WEBHOOK_SCRIPT: "ci/send_webhook.py"

  TRIVY_INSECURE: "true"
  KANIKO_REGISTRY_FLAGS: "--insecure --insecure-registry nexus:8081"
